name: Build
on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
jobs:
  build:
    strategy:
      matrix:
        # macOS-first port (2026-09): build-cmd.sh now builds darwin/linux too,
        # each with a real local build+test pass behind it -- see its own
        # comments for why. windows-2022 stays the only actually-shipping
        # platform; ubuntu-latest/macos-latest exist for CI-verified porting
        # confidence, not (yet) a real release target.
        os: [windows-2022, ubuntu-latest, macos-latest]
        addrsize: ["64"]
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: secondlife/action-autobuild@v5
        with:
          addrsize: ${{ matrix.addrsize }}
  release:
    needs: build
    runs-on: [ubuntu-latest]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: secondlife/action-autobuild-release@v3
        with:
          public: true
